<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palubný Počítač Autobusu - IBIS</title>
  <style>
    :root {
      --bg: #1e2530;
      --panel: #2a3443;
      --accent: #3182ce;
      --accent-hover: #2b6cb0;
      --text: #ffffff;
      --text-muted: #a0aec0;
      --border: #3d4b5e;
      --success: #38a169;
      --danger: #e53e3e;
      --warning: #dd6b20;
      --route-line: #f6e05e;
    }

    body.night-mode {
      --bg: #12161f;
      --panel: #18202c;
      --border: #283344;
      --route-line: #ecc94b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; transition: background 0.3s; }
    .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; }

    header {
      grid-column: 1 / -1;
      background: var(--panel);
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); }

    /* Palubný Displej */
    .dashboard-panel {
      background: var(--panel);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .display-screen {
      background: #101721;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 15px;
    }
    .disp-row { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 8px; }
    .disp-main { font-size: 1.6rem; font-weight: 700; color: #4299e1; text-align: center; margin: 10px 0; }

    /* Controls */
    .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
    select { flex: 1; padding: 10px; border-radius: 6px; background: #1a202c; color: white; border: 1px solid var(--border); font-size: 1rem; }

    /* Lístky mriežka */
    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); }
    .ticket-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ticket-btn {
      background: #232d3b;
      border: 1px solid var(--border);
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 75px;
      transition: border 0.2s;
    }
    .ticket-btn:hover { border-color: var(--accent); }
    .ticket-name { font-size: 0.85rem; font-weight: 600; }
    .ticket-price { font-size: 1.1rem; color: #68d391; font-weight: 700; align-self: flex-end; }

    /* Mapa */
    .map-box {
      background: #151c24;
      border-radius: 10px;
      border: 1px solid var(--border);
      height: 380px;
      position: relative;
      overflow: hidden;
    }
    .compass { position: absolute; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
    .compass.n { top: 10px; left: 50%; transform: translateX(-50%); }
    .compass.s { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .compass.e { right: 10px; top: 50%; transform: translateY(-50%); }
    .compass.w { left: 10px; top: 50%; transform: translateY(-50%); }

    svg.route-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    polyline.route-path { fill: none; stroke: var(--route-line); stroke-width: 4; stroke-dasharray: 6 4; opacity: 0.8; }

    .stop-dot {
      position: absolute;
      width: 12px; height: 12px;
      background: #e2e8f0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .stop-dot.active { background: #48bb78; box-shadow: 0 0 10px #48bb78; }
    .stop-txt {
      position: absolute;
      font-size: 0.75rem;
      color: #cbd5e0;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      transform: translate(-50%, -190%);
      white-space: nowrap;
      z-index: 2;
    }

    #bus-marker {
      position: absolute;
      font-size: 1.5rem;
      transform: translate(-50%, -50%);
      transition: left 0.5s linear, top 0.5s linear;
      z-index: 3;
    }

    /* Štatistika */
    .stats-row { display: flex; gap: 10px; margin-top: 15px; }
    .stat-card { flex: 1; background: var(--panel); padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: #4299e1; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>🚌 IBIS Palubný Počítač</h2>
    <div>
      <span id="clock" style="margin-right: 15px; font-weight: 600;">00:00:00</span>
      <button class="btn btn-warning" onclick="toggleNightMode()">🌙 Nočný Režim</button>
    </div>
  </header>

  <!-- Ľavá strana -->
  <div>
    <div class="dashboard-panel">
      <div class="display-screen">
        <div class="disp-row">
          <span id="disp-line">LINKA: --</span>
          <span id="disp-delay">MEŠKANIE: 0s</span>
        </div>
        <div class="display-main" id="disp-stop">VYBERTE LINKU</div>
        <div class="disp-row">
          <span id="disp-next">NASLEDUJE: --</span>
          <span id="disp-time">PLÁN: --</span>
        </div>
      </div>

      <div class="controls-row">
        <select id="line-select">
          <option value="">-- Vyberte linku --</option>
          <option value="101">Linka 101 - Dvorný okruh</option>
          <option value="201">Linka 201 - Expres</option>
          <option value="N91">Linka N91 - Nočná</option>
        </select>
        <button class="btn" id="btn-start" onclick="startLine()">Spustiť Linku</button>
      </div>

      <button class="btn btn-success" id="btn-arrive" style="width: 100%; padding: 12px; font-size: 1.1rem;" onclick="announceArrival()" disabled>
        🔔 Hlásiť príchod
      </button>
    </div>

    <div class="dashboard-panel">
      <div class="section-title">Predaj lístkov</div>
      <div class="ticket-grid" id="ticket-grid"></div>
    </div>
  </div>

  <!-- Pravá strana -->
  <div>
    <div class="dashboard-panel">
      <div class="section-title">Mapa dvora</div>
      <div class="map-box" id="map">
        <div class="compass n">SEVER (Brána)</div>
        <div class="compass s">JUH (Garáž)</div>
        <div class="compass e">VÝCHOD (Altánok)</div>
        <div class="compass w">ZÁPAD (Stanica)</div>

        <svg class="route-svg">
          <polyline id="route-line" class="route-path" points="" />
        </svg>

        <div id="bus-marker">🚌</div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div style="font-size:0.8rem; color:var(--text-muted)">Predané lístky</div>
          <div class="stat-val" id="stat-count">0 ks</div>
        </div>
        <div class="stat-card">
          <div style="font-size:0.8rem; color:var(--text-muted)">Celková tržba</div>
          <div class="stat-val" id="stat-revenue">0.00 €</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Zastávky a ich presné súradnice v % na mape
  const stops = {
    "Garáž": { x: 50, y: 85 },
    "Pri schodoch": { x: 50, y: 50 },
    "Pri altánku": { x: 80, y: 50 },
    "Brána": { x: 50, y: 15 },
    "Železničná stanica": { x: 20, y: 50 }
  };

  // Trasy liniek
  const routes = {
    "101": ["Garáž", "Pri altánku", "Brána", "Pri schodoch", "Železničná stanica", "Garáž"],
    "201": ["Garáž", "Železničná stanica", "Brána", "Garáž"],
    "N91": ["Garáž", "Pri altánku", "Brána", "Pri schodoch", "Garáž"]
  };

  const tickets = [
    { name: "Obyčajný", price: 1.00 },
    { name: "Žiak / Študent", price: 0.50 },
    { name: "Osobitné nad 70 r.", price: 0.20 },
    { name: "Osobitné - Senior", price: 0.40 },
    { name: "Dieťa 0-6 rokov", price: 0.00 },
    { name: "Dieťa 6-18 rokov", price: 0.50 },
    { name: "Zľavnené - ŤZP", price: 0.30 },
    { name: "Osobitné - Zamestnanec", price: 0.00 },
    { name: "Osobitné - Dieťa zamestnanca", price: 0.00 },
    { name: "Osobitné - Tehotná žena", price: 0.00 }
  ];

  let currentRoute = null;
  let currentIndex = 0;
  let revenue = 0;
  let count = 0;
  let startTime = 0;
  let plannedSecs = 0;
  let delay = 0;
  let busAnimInterval = null;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(freq, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.start();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  function playGong(cb) {
    playSound(600, 0.15);
    setTimeout(() => { playSound(900, 0.3); if (cb) setTimeout(cb, 400); }, 150);
  }

  function speak(text, cb) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'sk-SK';
      if (cb) u.onend = cb;
      window.speechSynthesis.speak(u);
    } else if (cb) cb();
  }

  function renderMap() {
    const map = document.getElementById('map');
    Object.keys(stops).forEach(s => {
      const pos = stops[s];
      const dot = document.createElement('div');
      dot.className = 'stop-dot';
      dot.id = 'dot-' + s.replace(/\s+/g, '');
      dot.style.left = pos.x + '%';
      dot.style.top = pos.y + '%';

      const txt = document.createElement('div');
      txt.className = 'stop-txt';
      txt.style.left = pos.x + '%';
      txt.style.top = pos.y + '%';
      txt.innerText = s;

      map.appendChild(dot);
      map.appendChild(txt);
    });
  }

  function renderTickets() {
    const grid = document.getElementById('ticket-grid');
    grid.innerHTML = '';
    tickets.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'ticket-btn';
      btn.innerHTML = `<span class="ticket-name">${t.name}</span><span class="ticket-price">${t.price.toFixed(2)} €</span>`;
      btn.onclick = () => {
        playSound(1100, 0.1);
        revenue += t.price;
        count++;
        document.getElementById('stat-revenue').innerText = revenue.toFixed(2) + ' €';
        document.getElementById('stat-count').innerText = count + ' ks';
      };
      grid.appendChild(btn);
    });
  }

  function startLine() {
    const lineId = document.getElementById('line-select').value;
    if (!lineId) return alert('Vyberte linku!');

    currentRoute = routes[lineId];
    currentIndex = 0;
    delay = 0;

    document.getElementById('disp-line').innerText = 'LINKA: ' + lineId;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('line-select').disabled = true;
    document.getElementById('btn-arrive').disabled = false;

    drawRouteLine();
    moveBusToStop(currentRoute[0]);
    nextLeg();
  }

  function drawRouteLine() {
    const poly = document.getElementById('route-line');
    const points = currentRoute.map(s => {
      const p = stops[s];
      return `${p.x * 3.8},${p.y * 3.8}`; // Prepočet na SVG súradnice
    }).join(' ');
    poly.setAttribute('points', points);
  }

  function moveBusToStop(stopName) {
    const pos = stops[stopName];
    const bus = document.getElementById('bus-marker');
    bus.style.left = pos.x + '%';
    bus.style.top = pos.y + '%';

    document.querySelectorAll('.stop-dot').forEach(d => d.classList.remove('active'));
    const activeDot = document.getElementById('dot-' + stopName.replace(/\s+/g, ''));
    if (activeDot) activeDot.classList.add('active');
  }

  function animateBusBetween(fromStop, toStop, durationSec) {
    if (busAnimInterval) clearInterval(busAnimInterval);
    const from = stops[fromStop];
    const to = stops[toStop];
    const bus = document.getElementById('bus-marker');
    
    let startTime = Date.now();
    busAnimInterval = setInterval(() => {
      let progress = (Date.now() - startTime) / (durationSec * 1000);
      if (progress >= 1) {
        progress = 1;
        clearInterval(busAnimInterval);
      }
      let currX = from.x + (to.x - from.x) * progress;
      let currY = from.y + (to.y - from.y) * progress;
      bus.style.left = currX + '%';
      bus.style.top = currY + '%';
    }, 50);
  }

  function nextLeg() {
    const curr = currentRoute[currentIndex];
    const next = currentRoute[currentIndex + 1];

    document.getElementById('disp-stop').innerText = curr;
    document.getElementById('disp-next').innerText = 'NASLEDUJE: ' + (next || 'Konečná');

    if (next) {
      plannedSecs = Math.floor(Math.random() * 21) + 15; // 15 až 35 sekúnd
      document.getElementById('disp-time').innerText = 'PLÁN: ' + plannedSecs + 's';
      startTime = Date.now();
      animateBusBetween(curr, next, plannedSecs);
    } else {
      document.getElementById('disp-time').innerText = 'PLÁN: --';
    }
  }

  function announceArrival() {
    if (!currentRoute) return;

    if (currentIndex < currentRoute.length - 1) {
      const elapsed = Math.round((Date.now() - startTime) / 1000);
      const diff = elapsed - plannedSecs;
      delay += diff;

      const delayEl = document.getElementById('disp-delay');
      delayEl.innerText = delay >= 0 ? `MEŠKANIE: +${delay}s` : `NADBEH: ${delay}s`;
      delayEl.style.color = delay > 0 ? '#fc8181' : (delay < 0 ? '#f6e05e' : '#cbd5e0');

      currentIndex++;
      const curr = currentRoute[currentIndex];
      const next = currentRoute[currentIndex + 1];
      const isEnd = currentIndex === currentRoute.length - 1;

      moveBusToStop(curr);

      playGong(() => {
        let msg = curr + ".";
        if (!isEnd) msg += " Nasledujúca zastávka: " + next;
        else msg += " Konečná zastávka. Prosíme vystúpte.";

        speak(msg, () => {
          if (isEnd) {
            document.getElementById('disp-stop').innerText = "KONIEC LINKY";
            document.getElementById('disp-next').innerText = "STANOVIŠTE: Garáž";
            document.getElementById('btn-arrive').disabled = true;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('line-select').disabled = false;
            alert("Koniec linky! Môžete si vybrať ďalšiu linku.");
          } else {
            nextLeg();
          }
        });
      });
    }
  }

  function toggleNightMode() { document.body.classList.toggle('night-mode'); }

  setInterval(() => {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString('sk-SK');
  }, 1000);

  window.onload = () => { renderMap(); renderTickets(); };
</script>
</body>
</html>
